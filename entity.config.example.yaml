# Entity Configuration Example
# Copy this file to entity.config.yaml and customize for your workspace
#
# Profile system: use config/profiles/${ENTITY_PROFILE}.yaml to override defaults

profile:
  displayName: "My Entity Workspace"
  description: "Personal local development workspace"

server:
  host: localhost
  port: 3000
  cors:
    origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  db:
    mode: LOCAL
    path: ./data/entity-tasks.db

agents:
  - name: assistant
    description: "General purpose AI assistant"
    model: local
    capabilities:
      - chat
      - code
      - search

fileSources: []

services: []

# =============================================================================
# SERVICE DISCOVERY — Mac integration (Ollama, Entity Mac app, SSH dispatch)
# =============================================================================
# Uncomment and fill in your values to enable Mac-based services:
#
# discovery:
#   mac:
#     enabled: true
#     # SSH target in user@host form (e.g. 'bob@192.168.1.50')
#     sshTarget: null
#     # Local Ollama server on Mac (e.g. 'http://192.168.1.50:11434')
#     ollamaUrl: null
#     # Entity app URL on Mac (e.g. 'http://192.168.1.50:3000')
#     entityUrl: null
#   # Global Ollama override (falls back to ENTITY_OLLAMA_BASE_URL env var)
#   ollama:
#     baseUrl: null
#   # Geordi Swarm dispatch — Codex host and Mac home path for tilde expansion
#   geordiSwarm:
#     # Hostname/IP of Mac running Codex (e.g. '192.168.1.50')
#     codexHost: null
#     # Local home path on Mac (e.g. '/Users/bob') — used to expand ~ in repo paths
#     macHomePath: null

logging:
  level: info
  format: json
