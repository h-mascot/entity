name: Private default scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan-private-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run scan:private-defaults -- --enforce
