name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ctrl-gate:
    name: CTRL Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run scan:private-defaults -- --enforce
      - run: npm run test:release-deploy
      # T-038 exact-SHA gate (R-039): record the checked-out exact SHA and prove,
      # fail-closed, that it equals the SHA this run evaluates and ships. The shared
      # entity-release-info exact-SHA check is the same primitive the sandbox-deploy
      # path uses for readback, so CI and deploy resolve to one reviewed candidate.
      - name: Record checked-out exact SHA and run shared exact-SHA gate
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Checked-out exact SHA: ${SOURCE_SHA}"
          echo "GitHub evaluated SHA: ${{ github.sha }}"
          if [ "${SOURCE_SHA}" != "${{ github.sha }}" ]; then
            echo "EXACT_SHA_MISMATCH: CI checkout ${SOURCE_SHA} != evaluated ${{ github.sha }}" >&2
            exit 1
          fi
          # The candidate SHA is scoped to this gate step only: it is passed to
          # the shared release-info gate inline via --sha, and is deliberately NOT
          # persisted to $GITHUB_ENV. A job-wide ENTITY_RELEASE_SHA would leak into
          # the later `node --test` steps and contaminate the temporary-repository
          # deploy regression test with a spurious SHA mismatch before its intended
          # branch-mismatch assertion (T-038 blocker 1).
          RECEIPT="$(mktemp -d)"
          node scripts/entity-release-info.mjs --root "${RECEIPT}" --sha "${SOURCE_SHA}" --branch "${GITHUB_REF_NAME}" --write
          node scripts/entity-release-info.mjs --check --root "${RECEIPT}" --expected "${SOURCE_SHA}"
      - run: node --test scripts/entity-openwiki-lib.test.mjs
      - run: npm run test:wiki-html
      - run: npm test || echo "Tests skipped (MVP mode)"
      - name: Check out PR head for generated-doc freshness
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install PR head dependencies for generated-doc freshness
        if: github.event_name == 'pull_request'
        run: npm ci
      - run: npm run docs:wiki:verify

  deploy:
    name: Deploy Handoff
    needs: ctrl-gate
    runs-on: ubuntu-latest
    if: github.repository == 'h-mascot/entity' && needs.ctrl-gate.result == 'success'
    steps:
      - name: Record gateway pull-deploy handoff
        run: |
          echo "GitHub public runners do not deploy over private networking."
          echo "The on-network Entity pull deployer polls this successful workflow and deploys the configured branch from inside the gateway network."
          echo "repo=${{ github.repository }}"
          echo "branch=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"

  notify:
    name: Notify
    if: always()
    needs: [ctrl-gate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}
          GATE: ${{ needs.ctrl-gate.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No webhook configured"
            exit 0
          fi
          if [ "$GATE" = "success" ] && [ "$DEPLOY" = "success" ]; then
            STATUS="✅ CI PASS - gateway deployer will pull tracked branch"
          elif [ "$GATE" = "success" ] && [ "$DEPLOY" = "skipped" ]; then
            STATUS="✅ CTRL PASS (no deploy - not main)"
          elif [ "$GATE" = "success" ]; then
            STATUS="⚠️ Gate passed, deploy $DEPLOY"
          else
            STATUS="❌ CTRL FAIL"
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"$STATUS — Entity (${{ github.ref_name }}) by ${{ github.actor }}\"}"
