name: Loop 008 — Nightly changelog

# Loop #008 "The nightly changelog" (Forward Future Loop Library), adopted per
# docs/loop-library-adoption.md. A deterministic step gathers the day's commits
# into .loop-cache/changelog-window.md; a Cursor cloud agent curates them into
# CHANGELOG.md; a deterministic step opens a PR.
#
# Activation (opt-in, so merging this never auto-starts scheduled agents):
#   1. Add repository secret CURSOR_API_KEY (Cursor dashboard API key).
#   2. Set repository variable ENTITY_LOOPS_ENABLED = "true" to enable the cron.
#   Manual `workflow_dispatch` runs work without the variable (still need the key).
#   Optional: repository variable ENTITY_LOOP_MODEL to override the model.

on:
  schedule:
    - cron: '7 5 * * *' # nightly 05:07 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window in days (default 1 = previous day)'
        required: false
        default: '1'

concurrency:
  group: loop-nightly-changelog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  nightly-changelog:
    name: Nightly changelog
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENTITY_LOOPS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::CURSOR_API_KEY secret is not set. Add it to enable the changelog loop."
            exit 1
          fi

      - name: Build changelog window (deterministic)
        run: |
          node scripts/changelog-window.mjs --days "${{ github.event.inputs.days || '1' }}"
          echo '----- window -----'
          cat .loop-cache/changelog-window.md

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Install restricted permission profile
        run: |
          mkdir -p "$HOME/.cursor"
          cp .cursor/loops/permissions/nightly-changelog.cli.json "$HOME/.cursor/cli-config.json"

      - name: Curate CHANGELOG.md (edits CHANGELOG.md only)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ENTITY_LOOP_MODEL: ${{ vars.ENTITY_LOOP_MODEL || 'gpt-5' }}
        run: |
          AGENT="$(command -v cursor-agent || command -v agent)"
          "$AGENT" -p --force --output-format text \
            --model "$ENTITY_LOOP_MODEL" \
            "$(cat .cursor/loops/008-nightly-changelog.md)"

      - name: Open PR if the changelog changed (deterministic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/loops/open-loop-pr.sh \
            "changelog" \
            "docs: update changelog (loop 008)" \
            "docs: nightly changelog (loop 008)"
