name: Loop 001 — Entity OpenWiki Guard

# Generation runs on Enterprise during sandbox shipping, where Codex OAuth is
# available without copying model credentials into GitHub. This workflow audits
# every successful CI run and the weekly schedule for stale generated docs.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-openwiki:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.ENTITY_LOOPS_ENABLED == 'true') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install renderer dependencies
        run: npm ci

      - name: Test OpenWiki integration
        run: node --test scripts/entity-openwiki-lib.test.mjs && npm run test:wiki-html

      - name: Verify generated docs match Entity source
        run: npm run docs:wiki:verify
