name: Loop 001 — Docs sweep

# Loop #001 "The docs sweep" (Forward Future Loop Library), adopted per
# docs/loop-library-adoption.md. A Cursor cloud agent reconciles Markdown docs
# with the implementation, then a deterministic step opens a PR.
#
# Activation (opt-in, so merging this never auto-starts scheduled agents):
#   1. Add repository secret CURSOR_API_KEY (Cursor dashboard API key).
#   2. Set repository variable ENTITY_LOOPS_ENABLED = "true" to enable the cron.
#   Manual `workflow_dispatch` runs work without the variable (still need the key).
#   Optional: repository variable ENTITY_LOOP_MODEL to override the model.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC (weekly)
  workflow_dispatch:

concurrency:
  group: loop-docs-sweep
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sweep:
    name: Docs sweep
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENTITY_LOOPS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::CURSOR_API_KEY secret is not set. Add it to enable the docs sweep loop."
            exit 1
          fi

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Install restricted permission profile
        run: |
          mkdir -p "$HOME/.cursor"
          cp .cursor/loops/permissions/docs-sweep.cli.json "$HOME/.cursor/cli-config.json"

      - name: Run docs sweep (edits Markdown only)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ENTITY_LOOP_MODEL: ${{ vars.ENTITY_LOOP_MODEL || 'gpt-5' }}
        run: |
          AGENT="$(command -v cursor-agent || command -v agent)"
          "$AGENT" -p --force --output-format text \
            --model "$ENTITY_LOOP_MODEL" \
            "$(cat .cursor/loops/001-docs-sweep.md)"

      - name: Open PR if docs changed (deterministic)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/loops/open-loop-pr.sh \
            "docs-sweep" \
            "docs: reconcile documentation with implementation (loop 001)" \
            "docs: docs sweep (loop 001)"
